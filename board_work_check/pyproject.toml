[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "board-work-check"
version = "1.0.0"
description = "CLI: оценка того, вёл ли преподаватель работу с контентом доски, по JSON-бэкапу"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["miro", "board", "backup", "teaching", "cli"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Topic :: Education",
]
dependencies = [
    "click>=8.1",
    "PyYAML>=6.0",
    "pydantic>=2.5",
    "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
board-work-check = "board_work_check.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["._tools", ".pytest_tmp", "tests/.test-tmp"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
